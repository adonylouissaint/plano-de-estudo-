<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner JS</title>
    <!-- Importando ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2><i class="fas fa-book-reader"></i> StudyPlan</h2>
            <nav>
                <ul>
                    <li class="active"><i class="fas fa-home"></i> Dashboard</li>
                    <li><i class="fas fa-calendar-alt"></i> Calendário</li>
                    <li><i class="fas fa-cog"></i> Configurações</li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header>
                <h1>Planejamento de Estudos</h1>
                <p id="currentDate">Carregando data...</p>
            </header>

            <!-- Formulário de Adição -->
            <section class="input-section">
                <div class="input-group">
                    <input type="text" id="subject" placeholder="Matéria (ex: Java, HTML)">
                    <input type="time" id="time">
                    <button id="addBtn"><i class="fas fa-plus"></i> Adicionar</button>
                </div>
            </section>

            <!-- Lista de Estudos -->
            <section class="list-section">
                <h3>Minha Agenda</h3>
                <ul id="studyList">
                    <!-- Os itens serão inseridos aqui via JS -->
                </ul>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
